name: RSS Reporting

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reporting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pandas requests beautifulsoup4 openpyxl

      - name: Run RSS collector with categories
        run: python rss_multi_sites_categories.py

      - name: Commit updated CSV and Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/rss_history.csv output/rss_history.xlsx
          git commit -m "Update RSS CSV & Excel (reporting)" || echo "Aucun changement"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
